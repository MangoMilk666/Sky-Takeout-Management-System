name: CD

on:
  push:
    branches: [prod]

concurrency:
  group: smart-dining-cd
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RELEASE_ID: ${{ github.sha }}
      DEPLOY_BASE_DIR: ${{ vars.DEPLOY_BASE_DIR || '/var/www/smart-dining' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar
        run: |
          mvn -f backend/pom.xml -pl sky-server -am clean package -DskipTests
          cp backend/sky-server/target/sky-server-*.jar backend/app.jar

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/smartdining-admin-react/package-lock.json

      - name: Build admin frontend
        working-directory: frontend/smartdining-admin-react
        run: |
          npm ci
          npm run build

      - name: Prepare release bundle
        run: |
          rm -rf release_bundle
          mkdir -p release_bundle/backend release_bundle/frontend

          cp docker-compose.prod.yml release_bundle/docker-compose.prod.yml
          cp backend/Dockerfile release_bundle/backend/Dockerfile
          cp backend/app.jar release_bundle/backend/app.jar

          cp -R frontend/smartdining-admin-react/dist/. release_bundle/frontend/

      - name: Prepare SSH key and known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Create remote directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "${{ env.DEPLOY_BASE_DIR }}/releases/${{ env.RELEASE_ID }}" "${{ env.DEPLOY_BASE_DIR }}/scripts" "${{ env.DEPLOY_BASE_DIR }}/shared"

      - name: Upload release and scripts (rsync)
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"

          rsync -az --delete -e "$RSYNC_SSH" release_bundle/ "$SSH_USER@$SSH_HOST:$DEPLOY_BASE_DIR/releases/$RELEASE_ID/"
          rsync -az -e "$RSYNC_SSH" scripts/deploy_smart_dining.sh "$SSH_USER@$SSH_HOST:$DEPLOY_BASE_DIR/scripts/deploy_smart_dining.sh"
          rsync -az -e "$RSYNC_SSH" scripts/smart-dining.conf "$SSH_USER@$SSH_HOST:$DEPLOY_BASE_DIR/scripts/smart-dining.conf"

      - name: Deploy on host
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BASE_DIR: ${{ env.DEPLOY_BASE_DIR }}
          APP_HOST_PORT: ${{ vars.APP_HOST_PORT }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
          TZ: ${{ vars.TZ }}
          UPLOAD_PATH_HOST: ${{ vars.UPLOAD_PATH_HOST }}
          SKY_UPLOAD_PATH: ${{ vars.SKY_UPLOAD_PATH }}
          UPLOAD_ACCESS_URL_PREFIX: ${{ vars.UPLOAD_ACCESS_URL_PREFIX }}
          SKY_DATASOURCE_DRIVER_CLASS_NAME: ${{ vars.SKY_DATASOURCE_DRIVER_CLASS_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SKY_REDIS_DATABASE: ${{ vars.SKY_REDIS_DATABASE }}
          JWT_ADMIN_KEY: ${{ secrets.JWT_ADMIN_KEY }}
          JWT_USER_KEY: ${{ secrets.JWT_USER_KEY }}
          JWT_ADMIN_TTL: ${{ vars.JWT_ADMIN_TTL }}
          JWT_ADMIN_TOKEN_NAME: ${{ vars.JWT_ADMIN_TOKEN_NAME }}
          JWT_USER_TTL: ${{ vars.JWT_USER_TTL }}
          JWT_USER_TOKEN_NAME: ${{ vars.JWT_USER_TOKEN_NAME }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_BASE_DIR,APP_HOST_PORT,SPRING_PROFILES_ACTIVE,TZ,UPLOAD_PATH_HOST,SKY_UPLOAD_PATH,UPLOAD_ACCESS_URL_PREFIX,SKY_DATASOURCE_DRIVER_CLASS_NAME,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,REDIS_PASSWORD,SKY_REDIS_DATABASE,JWT_ADMIN_KEY,JWT_USER_KEY,JWT_ADMIN_TTL,JWT_ADMIN_TOKEN_NAME,JWT_USER_TTL,JWT_USER_TOKEN_NAME,WECHAT_APPID,WECHAT_SECRET
          script: |
            set -euo pipefail

            escape_squotes() {
              printf "%s" "${1:-}" | sed "s/'/'\"'\"'/g"
            }

            ENV_DIR="${DEPLOY_BASE_DIR}/shared"
            ENV_FILE="${ENV_DIR}/.env.prod"
            TMP_FILE="${ENV_FILE}.tmp"

            mkdir -p "$ENV_DIR"
            umask 077

            {
              echo "DEPLOY_BASE_DIR='$(escape_squotes "${DEPLOY_BASE_DIR:-}")'"
              echo "APP_HOST_PORT='$(escape_squotes "${APP_HOST_PORT:-}")'"
              echo "SPRING_PROFILES_ACTIVE='$(escape_squotes "${SPRING_PROFILES_ACTIVE:-}")'"
              echo "TZ='$(escape_squotes "${TZ:-}")'"
              echo "UPLOAD_PATH_HOST='$(escape_squotes "${UPLOAD_PATH_HOST:-}")'"
              echo "SKY_UPLOAD_PATH='$(escape_squotes "${SKY_UPLOAD_PATH:-}")'"
              echo "UPLOAD_ACCESS_URL_PREFIX='$(escape_squotes "${UPLOAD_ACCESS_URL_PREFIX:-}")'"
              echo "SKY_DATASOURCE_DRIVER_CLASS_NAME='$(escape_squotes "${SKY_DATASOURCE_DRIVER_CLASS_NAME:-}")'"

              echo "DB_HOST='$(escape_squotes "${DB_HOST:-}")'"
              echo "DB_PORT='$(escape_squotes "${DB_PORT:-}")'"
              echo "DB_NAME='$(escape_squotes "${DB_NAME:-}")'"
              echo "DB_USER='$(escape_squotes "${DB_USER:-}")'"
              echo "DB_PASSWORD='$(escape_squotes "${DB_PASSWORD:-}")'"

              echo "REDIS_PASSWORD='$(escape_squotes "${REDIS_PASSWORD:-}")'"
              echo "SKY_REDIS_DATABASE='$(escape_squotes "${SKY_REDIS_DATABASE:-}")'"

              echo "JWT_ADMIN_KEY='$(escape_squotes "${JWT_ADMIN_KEY:-}")'"
              echo "JWT_USER_KEY='$(escape_squotes "${JWT_USER_KEY:-}")'"
              echo "JWT_ADMIN_TTL='$(escape_squotes "${JWT_ADMIN_TTL:-}")'"
              echo "JWT_ADMIN_TOKEN_NAME='$(escape_squotes "${JWT_ADMIN_TOKEN_NAME:-}")'"
              echo "JWT_USER_TTL='$(escape_squotes "${JWT_USER_TTL:-}")'"
              echo "JWT_USER_TOKEN_NAME='$(escape_squotes "${JWT_USER_TOKEN_NAME:-}")'"

              echo "WECHAT_APPID='$(escape_squotes "${WECHAT_APPID:-}")'"
              echo "WECHAT_SECRET='$(escape_squotes "${WECHAT_SECRET:-}")'"
            } > "$TMP_FILE"

            mv -f "$TMP_FILE" "$ENV_FILE"
            chmod 600 "$ENV_FILE" || true

            chmod +x "${{ env.DEPLOY_BASE_DIR }}/scripts/deploy_smart_dining.sh"
            bash "${{ env.DEPLOY_BASE_DIR }}/scripts/deploy_smart_dining.sh" "${{ env.RELEASE_ID }}"
