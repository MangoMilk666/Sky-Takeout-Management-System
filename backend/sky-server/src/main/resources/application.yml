server:
  port: 8080
  # ========== Tomcat 线程池调优 ==========
  # 当前部署机为 2 核 2G，且 MySQL 与应用同机部署。
  # 这里不再追求“线程越多越好”，而是优先控制线程数与上下文切换开销，避免把内存打爆。
  tomcat:
    threads:
      max: 120          # 最大工作线程数：2 核机器上保守收敛，降低线程栈与调度开销
      min-spare: 10     # 最小空闲线程数：保留基础预热能力，避免突发流量完全冷启动
    accept-count: 100   # 线程池满后的等待队列，适度保留缓冲，避免排队过深
    max-connections: 4096  # 2G 机器无需放太大，避免无意义连接堆积

spring:
  profiles:
    # 激活dev配置，本配置引用其数据
    active: dev
  main:
    allow-circular-references: true

  # ========== 定时任务线程池 ==========
  # 2 核机器上不宜开太多调度线程，2 个线程足以避免串行阻塞，同时减少额外内存与 CPU 竞争
  task:
    scheduling:
      pool:
        size: 2

  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}

      # ========== Druid 连接池调优 ==========
      # 压测 OOM 说明当前瓶颈不是“连接太少”，而是“单机总资源不足”。
      # 2 核 2G 且 MySQL 同机时，把连接池控制在 20 左右更稳妥，避免 Java 和 MySQL 同时膨胀。
      initial-size: 5         # 启动时预创建少量连接，兼顾预热与内存占用
      min-idle: 5             # 保持基础空闲连接，避免低峰期回收到 0
      max-active: 20          # 限制最大并发 SQL 连接数，降低 MySQL 线程与内存压力
      max-wait: 3000          # 最多等 3s 拿连接，过载时快速失败而不是把 Tomcat 线程全部拖死
      validation-query: SELECT 1  # 连接有效性检查 SQL
      test-while-idle: true   # 空闲时检测连接有效性，及时剔除断开的连接
      test-on-borrow: false   # 借出时不检测，减少开销
      time-between-eviction-runs-millis: 60000  # 每 60s 检测一次空闲连接
      pool-prepared-statements: true             # 开启 PreparedStatement 缓存，提升重复 SQL 执行效率

  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}

    # ========== Lettuce 连接池调优 ==========
    # Redis 在本项目主要承担缓存与队列；在 2 核 2G 机器上，连接池也需要走保守配置，
    # 目标是避免单连接争用，同时不额外制造过多空闲连接占用。
    lettuce:
      pool:
        max-active: 8    # 控制 Redis 并发连接上限，避免过多连接堆积
        max-idle: 4      # 最大空闲连接数
        min-idle: 2      # 最小空闲连接数：兼顾预热与资源占用
        max-wait: 2000ms # Redis 拿连接最多等 2s，避免长时间阻塞业务线程
      shutdown-timeout: 200ms  # 优雅关闭等待时间
    timeout: 3000ms      # Redis 操作超时时间：快速失败，避免把应用线程长时间挂住

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # ==========管理端========
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${sky.jwt.admin-secret-key}
    # 设置jwt过期时间
    admin-ttl: ${sky.jwt.admin-ttl}
    # 设置前端传递过来的令牌名称
    admin-token-name: ${sky.jwt.admin-token-name}

    # ==========用户端========
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: ${sky.jwt.user-secret-key}
    # 设置jwt过期时间
    user-ttl: ${sky.jwt.user-ttl}
    # 设置前端传递过来的令牌名称
    user-token-name: ${sky.jwt.user-token-name}
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
  cors:
    # 跨域配置，由 SKY_CORS_ALLOWED_ORIGINS 环境变量注入
    # 缺失时自动用localhost:5173
    allowed-origins: ${SKY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
