# 生产标准版，作为唯一可提交的生产 compose 文件
# 作用：给 GitHub Actions 打包进 release，用于宿主机 current/docker-compose.prod.yml 部署
services:
  sky-redis:
    image: redis:7-alpine
    container_name: sky-redis
    restart: unless-stopped
    environment:
      # 未设置密码可留空
      - REDIS_PASSWORD=${REDIS_PASSWORD:-} 
    command:
      - sh
      - -c
      - |
        if [ -n "${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --maxmemory 128mb --maxmemory-policy allkeys-lru;
        else
          exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru;
        fi
    volumes:
      - sky_redis_data:/data
    # Redis 容器资源限制：2 核 2G 机器上只保留小体量缓存空间，避免与 MySQL、JVM 争内存
    mem_limit: 256m
    cpus: 0.50

  sky-takeout-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sky-takeout-app
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-8081}:8080"
    depends_on:
      - sky-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UPLOAD_PATH_HOST}:/app/data/img_data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}

      - SKY_DATASOURCE_DRIVER_CLASS_NAME=${SKY_DATASOURCE_DRIVER_CLASS_NAME:-com.mysql.cj.jdbc.Driver}
      - SKY_DATASOURCE_HOST=${DB_HOST}
      - SKY_DATASOURCE_PORT=${DB_PORT}
      - SKY_DATASOURCE_DATABASE=${DB_NAME}
      - SKY_DATASOURCE_USERNAME=${DB_USER}
      - SKY_DATASOURCE_PASSWORD=${DB_PASSWORD}

      - SKY_REDIS_HOST=sky-redis
      - SKY_REDIS_PORT=6379
      - SKY_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SKY_REDIS_DATABASE=${SKY_REDIS_DATABASE:-0}

      - SKY_JWT_ADMIN_SECRET_KEY=${JWT_ADMIN_KEY}
      - SKY_JWT_ADMIN_TTL=${JWT_ADMIN_TTL:-7200000}
      - SKY_JWT_ADMIN_TOKEN_NAME=${JWT_ADMIN_TOKEN_NAME:-token}

      - SKY_JWT_USER_SECRET_KEY=${JWT_USER_KEY}
      - SKY_JWT_USER_TTL=${JWT_USER_TTL:-7200000}
      - SKY_JWT_USER_TOKEN_NAME=${JWT_USER_TOKEN_NAME:-authentication}

      - SKY_UPLOAD_PATH=${SKY_UPLOAD_PATH:-/app/data/img_data/}
      - SKY_UPLOAD_ACCESS_URL_PREFIX=${UPLOAD_ACCESS_URL_PREFIX:-/admin/common/upload/}

      - SKY_WECHAT_APPID=${WECHAT_APPID}
      - SKY_WECHAT_SECRET=${WECHAT_SECRET}
      # 透传 SKY_CORS_ALLOWED_ORIGINS 环境变量到容器，设定允许访问的前端的源
      - SKY_CORS_ALLOWED_ORIGINS=${SKY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

    # 应用容器资源限制：针对 2 核 2G、MySQL 仍同机部署的场景，主动给 Java 留出边界。
    # 这里优先使用普通 docker compose 能直接识别的 mem_limit / cpus。
    mem_limit: 768m
    cpus: 1.50

volumes:
  sky_redis_data:
    driver: local
