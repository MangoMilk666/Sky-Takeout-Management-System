# 外卖项目生产端的nginx配置文件
server {
    # 监听 80 端口（HTTP）
    # 绑定你的域名
    server_name smart-dining.henrysang.site;

    # 定义前端静态资源的物理路径（指向当前的软链版本）
    root /var/www/smart-dining/current/frontend;
    # 设置默认访问页面
    index index.html index.htm;
    # 允许上传的最大文件尺寸（设为 20MB）
    client_max_body_size 20m;

    # 后端管理 API 反向代理
    location /api/ {
        # 将请求转发至本地 8081 端口的 /admin/ 路径
        proxy_pass http://127.0.0.1:8081/admin/;
        # 传递原始主机名
        proxy_set_header Host $host;
        # 传递真实客户端 IP
        proxy_set_header X-Real-IP $remote_addr;
        # 记录转发链路中的 IP 列表
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 传递原始协议（HTTP/HTTPS）
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户相关 API 反向代理
    location /user/ {
        # 将请求转发至本地 8081 端口的 /user/ 路径
        proxy_pass http://127.0.0.1:8081/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 菜品图片静态资源反向代理
    # 上传接口通过 /api/ 走，但图片访问路径是 /admin/common/upload/，
    # 需要单独代理到后端，否则会被前端兜底规则拦截
    location /admin/common/upload/ {
        proxy_pass http://127.0.0.1:8081/admin/common/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片缓存 7 天，减轻后端压力
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket 长连接反向代理
    location /ws/ {
        proxy_pass http://127.0.0.1:8081/ws/;
        # 使用 HTTP 1.1 协议（WebSocket 必须）
        proxy_http_version 1.1;
        # 设置超时时间为 1 小时
        proxy_read_timeout 3600s;
        # 开启协议升级头信息（从 HTTP 升级到 WebSocket）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端路由支持（关键：解决单页应用刷新页面 404 问题）
    location / {
        # 尝试按照文件名查找，若找不到则返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # 自定义错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        # 错误页面指向前端目录
        root /var/www/smart-dining/current/frontend;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/smart-dining.henrysang.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/smart-dining.henrysang.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = smart-dining.henrysang.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name smart-dining.henrysang.site;
    return 404; # managed by Certbot


}